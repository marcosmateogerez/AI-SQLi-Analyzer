services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-sqli-analyzer-db
    restart: always
    attach: false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 2s
      timeout: 3s
      retries: 5
    logging:
      driver: "none"

  analyzer:
    build: .
    container_name: ai-sqli-analyzer-app
    depends_on:
      postgres:
        condition: service_healthy
    network_mode: "service:postgres"
    volumes:
      - .:/app